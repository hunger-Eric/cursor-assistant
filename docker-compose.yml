version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
      - '18080:8080'
    volumes:
      - ./data:/root/.cursor-assistant
      - ./backend/cursor-assistant.db:/app/cursor-assistant.db
    environment:
      - CMA_DEBUG=false
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - '13000:80'
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge


